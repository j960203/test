<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 웹 바코드 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        #reader {
            width: 100%;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            max-width: 470px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .result-title {
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        .result-text {
            font-size: 1.3rem;
            color: #007bff;
            word-break: break-all;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        /* 알림창 스타일 추가 */
        .alert { padding: 12px; margin: 10px 0; border-radius: 6px; font-weight: bold; display: none; }
        .alert-ok { background-color: #d4edda; color: #155724; }
        .alert-fail { background-color: #f8d7da; color: #721c24; }
        .alert-warn { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <h1>바코드 스캐너</h1>
    
    <div id="scanner-container">
        <div id="reader"></div>
    </div>

    <div id="alert-box" class="alert"></div>

    <div id="result-box">
        <div class="result-title">인식된 바코드 데이터</div>
        <div id="result" class="result-text">바코드를 화면에 맞춰주세요.</div>
        <button class="btn" onclick="startScanner()">다시 스캔하기</button>
    </div>

    <script>
        // ── 기본 환경 변수 선언 (Supabase 설정 등이 위에 살아있다면 자동 연동됩니다) ──
        if (typeof db === 'undefined') {
            window.db = {
                from: () => ({
                    select: () => ({
                        eq: () => ({ data: [] }),
                        update: () => ({ eq: () => ({}) })
                    }),
                    update: () => ({ eq: () => ({}) })
                })
            };
        }
        if (typeof currentDept === 'undefined') window.currentDept = '기본부서';
        if (typeof currentUser === 'undefined') window.currentUser = { name: '작업자' };
        if (typeof updateProgress === 'undefined') window.updateProgress = () => {};
        if (typeof renderSvList === 'undefined') window.renderSvList = () => {};


        let html5QrCode;
        let lastScanned = '', lastScannedTime = 0; // 중복 방지 변수

        function startScanner() {
            document.getElementById('result').innerText = "바코드를 화면에 맞춰주세요.";
            document.getElementById('result').style.color = "#007bff";
            hideAlerts();

            if (html5QrCode) {
                html5QrCode.clear();
            }

            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return { width: viewfinderWidth * 0.8, height: viewfinderHeight * 0.3 };
                }
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("카메라 시작 실패:", err);
                document.getElementById('result').innerText = "카메라를 시작할 수 없습니다. (HTTPS 연결 확인 필요)";
                document.getElementById('result').style.color = "red";
            });
        }

        // 스캔 성공 시 실행되는 구역
        function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            const trimmedText = decodedText.trim();

            // 💡 3초 이내 중복 스캔 방지 로직 장착
            if (trimmedText === lastScanned && now - lastScannedTime < 3000) return;
            lastScanned = trimmedText;
            lastScannedTime = now;

            if (navigator.vibrate) navigator.vibrate(100);

            // 화면 가이드에 텍스트 바로 출력
            document.getElementById('result').innerText = trimmedText;
            document.getElementById('result').style.color = "#28a745";
            
            // 💡 자동 정지 처리 후 데이터베이스에서 자산 검색
            html5QrCode.stop().then((ignore) => {
                console.log("조회를 위해 카메라 일시정지");
                checkAsset(trimmedText); // 자산 조회 함수 실행
            }).catch((err) => {
                console.error("카메라 정지 실패:", err);
            });
        }

        function onScanFailure(error) {
            // 프레임 탐색 에러 생략
        }

        // ── 💡 합쳐진 데이터베이스 자산 검증 로직 ───────────────────────
        async function checkAsset(assetId) {
            hideAlerts();
            const raw = assetId.trim();
            const noDash = raw.replace(/-/g, '');

            // 1) asset_id 직접 일치
            let { data: rows } = await db.from('assets').select('*').eq('asset_id', raw);

            // 2) asset_id에서 - 제거 후 비교
            if (!rows?.length) {
                const { data: all } = await db.from('assets').select('*').eq('department', currentDept);
                rows = (all || []).filter(a => a.asset_id.replace(/-/g,'') === noDash);
            }

            // 3) registration_no로 검색
            if (!rows?.length) {
                const { data: r } = await db.from('assets').select('*').eq('registration_no', raw);
                rows = r || [];
            }

            if (!rows?.length) { showAlert('fail', `자산번호 ${raw} — 목록에 없는 자산입니다`); return; }
            const a = rows[0];
            if (a.department !== currentDept) { showAlert('fail', `${raw} — 이 부서 소속이 아닙니다 (${a.department})`); return; }
            if (a.checked) { showAlert('warn', `${a.asset_id} [${a.name}] — 이미 확인된 자산입니다`); return; }
            
            // 데이터베이스 업데이트
            await db.from('assets').update({ 
                checked: true, 
                checked_by: currentUser.name, 
                checked_at: new Date().toISOString() 
            }).eq('id', a.id);
            
            showAlert('ok', `✅ ${a.asset_id} [${a.name}] — 확인 완료!`);
            updateProgress(); 
            renderSvList('');
        }

        // 알림 제어용 유틸리티 함수
        function showAlert(type, message) {
            const box = document.getElementById('alert-box');
            if(!box) return;
            box.className = `alert alert-${type}`;
            box.innerText = message;
            box.style.display = 'block';
        }

        function hideAlerts() {
            const box = document.getElementById('alert-box');
            if(box) box.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
