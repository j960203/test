<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 웹 바코드 스캐너</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
        }
        #scanner-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        /* 스캐너 화면 크기 조절 */
        #reader {
            width: 100%;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            max-width: 470px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .result-title {
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        .result-text {
            font-size: 1.3rem;
            color: #007bff;
            word-break: break-all;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>바코드 스캐너</h1>
    
    <div id="scanner-container">
        <div id="reader"></div>
    </div>

    <div id="result-box">
        <div class="result-title">인식된 바코드 데이터</div>
        <div id="result" class="result-text">바코드를 화면에 맞춰주세요.</div>
        <button class="btn" onclick="startScanner()">다시 스캔하기</button>
    </div>

    <script>
        let html5QrCode;

        function startScanner() {
            document.getElementById('result').innerText = "바코드를 화면에 맞춰주세요.";
            document.getElementById('result').style.color = "#007bff";

            // 기존 스캐너 인스턴스가 있다면 정리
            if (html5QrCode) {
                html5QrCode.clear();
            }

            html5QrCode = new Html5Qrcode("reader");
            
            // 스캐너 설정 (정밀도 및 초당 프레임 수)
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    // 바코드는 가로가 기므로 직사각형 형태로 스캔 영역 지정
                    return { width: viewfinderWidth * 0.8, height: viewfinderHeight * 0.3 };
                }
            };

            // 후면 카메라(environment) 우선 사용 요청
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("카메라 시작 실패:", err);
                document.getElementById('result').innerText = "카메라를 시작할 수 없습니다. (HTTPS 연결 확인 필요)";
                document.getElementById('result').style.color = "red";
            });
        }

        // 스캔 성공 시 실행될 콜백 함수
        function onScanSuccess(decodedText, decodedResult) {
            // 진동 피드백 (스마트폰 지원 기능)오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27오후 4:31 2026-05-27
            if (navigator.vibrate) navigator.vibrate(100);

            // 결과 화면에 출력
            document.getElementById('result').innerText = decodedText;
            document.getElementById('result').style.color = "#28a745";
            
            // 성공 후 자동 스탑 (원치 않으면 주석 처리)
            html5QrCode.stop().then((ignore) => {
                console.log("스캔 성공으로 카메라 일시정지");
            }).catch((err) => {
                console.error("카메라 정지 실패:", err);
            });
        }

        // 스캔 실패 시 실행될 콜백 함수 (프레임마다 바코드가 없으면 계속 호출됨)
        function onScanFailure(error) {
            // 콘솔이 너무 복잡해지므로 대다수 에러는 무시합니다.
        }

        // 페이지 로드 시 자동으로 스캐너 시작
        window.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
