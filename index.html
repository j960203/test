<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산관리 스캐너</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* 기본 스타일 튜닝 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; text-align: center; }
        button { padding: 12px 24px; font-size: 1rem; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:active { background-color: #0056b3; }
        
        /* 💡 스캐너 뷰어 스타일 최적화 */
        #qr-scanner-wrap { width: 100%; max-width: 500px; margin: 0 auto; display: none; }
        #qr-reader { width: 100%; background-color: #000; border-radius: 8px; overflow: hidden; }
        
        /* html5-qrcode 내부 가이드라인 및 버튼 커스텀 CSS */
        #qr-reader__dashboard { padding: 10px !important; }
        #qr-reader button { background-color: #dc3545 !important; margin-top: 10px; }
        
        /* 결과 메시지 스타일 */
        .alert { padding: 12px; margin: 10px 0; border-radius: 6px; font-weight: bold; }
        .alert-ok { background-color: #d4edda; color: #155724; }
        .alert-fail { background-color: #f8d7da; color: #721c24; }
        .alert-warn { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <h2>자산관리 스캔 시스템</h2>
    <hr>

    <div id="qr-start-area">
        <p>자산 스캔을 시작하려면 아래 버튼을 눌러주세요.</p>
        <button onclick="startScan()">스캔 시작하기</button>
    </div>

    <div id="qr-scanner-wrap">
        <div id="qr-reader"></div>
        
        <div id="scanned-result-text" style="font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #007bff;">
            스캔 대기 중...
        </div>

        <button onclick="stopScan()" style="background-color: #6c757d;">스캔 종료</button>
    </div>

    <div id="alert-box" style="display: none;" class="alert"></div>

    <script>
        // ── 가상 데이터베이스 및 환경 변수 (기존 환경에 맞게 자동 매칭용 구동 코드) ──
        // 실제 운영 환경의 db, currentDept, currentUser 변수가 전역에 선언되어 있다면 이 구역은 삭제되거나 덮어씌워집니다.
        if (typeof db === 'undefined') {
            window.db = {
                from: () => ({
                    select: () => ({
                        eq: () => ({ data: [] }),
                        update: () => ({ eq: () => ({}) })
                    }),
                    update: () => ({ eq: () => ({}) })
                })
            };
        }
        if (typeof currentDept === 'undefined') window.currentDept = '기본부서';
        if (typeof currentUser === 'undefined') window.currentUser = { name: '작업자' };
        if (typeof updateProgress === 'undefined') window.updateProgress = () => {};
        if (typeof renderSvList === 'undefined') window.renderSvList = () => {};


        // ── 💡 html5-qrcode 핵심 스캔 로직 ──────────────────────────────
        let html5QrcodeScanner = null;
        let lastScanned = '', lastScannedTime = 0;

        async function startScan() {
            document.getElementById('qr-start-area').style.display = 'none';
            document.getElementById('qr-scanner-wrap').style.display = 'block';
            hideAlerts();
            
            const resultDisplay = document.getElementById('scanned-result-text');
            if (resultDisplay) resultDisplay.innerText = "스캔 대기 중...";

            // 1. 지원할 포맷 타겟팅 (바코드 CODE_128, CODE_39 및 QR코드 전체 포함)
            const formatsToSupport = [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.QR_CODE
            ];

            // 2. 스캐너 객체 생성
            html5QrcodeScanner = new Html5Qrcode("qr-reader", { 
                formatsToSupport: formatsToSupport,
                verbose: false 
            });

            // 3. 카메라 및 가이드라인 박스 설정 (바코드 인식에 최적화된 가로 사각형)
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.3)
                    };
                },
                aspectRatio: 1.777778 // 16:9 비율 유지로 선 왜곡 원천 차단
            };

            try {
                // 4. 후면 카메라(environment) 방향으로 스캔 시작
                await html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText, decodedResult) => {
                        const now = Date.now();
                        const trimmedText = decodedText.trim();

                        // 3초 이내 중복 스캔 방지
                        if (trimmedText === lastScanned && now - lastScannedTime < 3000) return;
                        
                        lastScanned = trimmedText;
                        lastScannedTime = now;

                        // 화면 결과 텍스트 영역에 찍어주기
                        if (resultDisplay) {
                            resultDisplay.innerText = `스캔된 결과: ${trimmedText}`;
                        }

                        // 기존 자산 데이터베이스 조회 함수 호출
                        checkAsset(trimmedText);
                    },
                    (errorMessage) => {
                        // 스캔 탐색 중 에러는 과부하 방지를 위해 로그 생략
                    }
                );
            } catch (err) {
                console.error("카메라 작동 실패:", err);
                showAlert('fail', '카메라를 시작할 수 없습니다. 권한 허용 및 HTTPS 접속 상태를 확인해 주세요.');
                stopScan();
            }
        }

        async function stopScan() {
            if (html5QrcodeScanner) {
                try {
                    await html5QrcodeScanner.stop();
                } catch (err) {
                    console.error("카메라 중지 실패:", err);
                }
                html5QrcodeScanner = null;
            }
            const a = document.getElementById('qr-start-area');
            const b = document.getElementById('qr-scanner-wrap');
            if (a) a.style.display = 'block';
            if (b) b.style.display = 'none';
        }

        // ── 데이터베이스 자산 검증 로직 ──────────────────────────────────
        async function checkAsset(assetId) {
            hideAlerts();
            const raw = assetId.trim();
            const noDash = raw.replace(/-/g, '');

            // 1) asset_id 직접 일치
            let { data: rows } = await db.from('assets').select('*').eq('asset_id', raw);

            // 2) asset_id에서 - 제거 후 비교
            if (!rows?.length) {
                const { data: all } = await db.from('assets').select('*').eq('department', currentDept);
                rows = (all || []).filter(a => a.asset_id.replace(/-/g,'') === noDash);
            }

            // 3) registration_no로 검색
            if (!rows?.length) {
                const { data: r } = await db.from('assets').select('*').eq('registration_no', raw);
                rows = r || [];
            }

            if (!rows?.length) { showAlert('fail', `자산번호 ${raw} — 목록에 없는 자산입니다`); return; }
            const a = rows[0];
            if (a.department !== currentDept) { showAlert('fail', `${raw} — 이 부서 소속이 아닙니다 (${a.department})`); return; }
            if (a.checked) { showAlert('warn', `${a.asset_id} [${a.name}] — 이미 확인된 자산입니다`); return; }
            
            await db.from('assets').update({ 
                checked: true, 
                checked_by: currentUser.name, 
                checked_at: new Date().toISOString() 
            }).eq('id', a.id);
            
            showAlert('ok', `✅ ${a.asset_id} [${a.name}] — 확인 완료!`);
            updateProgress(); 
            renderSvList('');
        }

        // 알림창 제어용 헬퍼 함수
        function showAlert(type, message) {
            const box = document.getElementById('alert-box');
            if(!box) return;
            box.className = `alert alert-${type}`;
            box.innerText = message;
            box.style.display = 'block';
        }

        function hideAlerts() {
            const box = document.getElementById('alert-box');
            if(box) box.style.display = 'none';
        }
    </script>
</body>
</html>
